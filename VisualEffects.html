<script>
  
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  let lightboxOpen = false;

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('active');
    lightboxOpen = true;
  }
  function closeLightbox() {
    lightbox.classList.remove('active');
    lightboxOpen = false;
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  // --- Reusable carousel builder ---
  function initCarousel(wrap, images) {
    const track = wrap.querySelector('.carousel-track');
    const autoSpeed = parseFloat(wrap.dataset.speed) || 0.6;

    const loopedImages = [...images, ...images, ...images];

    loopedImages.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'carousel-img';
      img.draggable = false;
      img.dataset.src = src;
      track.appendChild(img);
    });

    let position = 0;
    let isDragging = false;
    let hasDragged = false;
    let startX = 0;
    let startPosition = 0;
    let oneSetWidth = 0;

    function measureSetWidth() {
      oneSetWidth = track.scrollWidth / 3;
    }
    window.addEventListener('load', measureSetWidth);
    window.addEventListener('resize', measureSetWidth);

    wrap.addEventListener('pointerdown', (e) => {
      isDragging = true;
      hasDragged = false;
      startX = e.clientX;
      startPosition = position;
      wrap.classList.add('dragging');
      wrap.setPointerCapture(e.pointerId);
    });

    wrap.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const delta = e.clientX - startX;
      if (Math.abs(delta) > 5) hasDragged = true;
      position = startPosition + delta;
    });

    function endDrag(e) {
      isDragging = false;
      wrap.classList.remove('dragging');

      if (!hasDragged) {
        const clickedImg = document.elementFromPoint(e.clientX, e.clientY);
        if (clickedImg && clickedImg.classList.contains('carousel-img')) {
          openLightbox(clickedImg.dataset.src);
        }
      }
    }
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointerleave', endDrag);

    function updateImageEffects() {
      const wrapRect = wrap.getBoundingClientRect();
      const centerX = wrapRect.left + wrapRect.width / 2;
      const maxDistance = wrapRect.width / 2;

      track.querySelectorAll('.carousel-img').forEach(img => {
        const imgRect = img.getBoundingClientRect();
        const imgCenter = imgRect.left + imgRect.width / 2;
        const distance = Math.abs(imgCenter - centerX);
        const ratio = Math.min(distance / maxDistance, 1);

        const scale = 1 - ratio * 0.35;
        const opacity = 1 - ratio * 0.75;

        img.style.transform = `scale(${scale})`;
        img.style.opacity = opacity;
      });
    }

    function tick() {
      if (!isDragging && !lightboxOpen) {
        position -= autoSpeed;
      }
      if (oneSetWidth > 0) {
        if (position <= -oneSetWidth * 2) position += oneSetWidth;
        if (position > -oneSetWidth * 0.5) position -= oneSetWidth;
      }
      track.style.transform = `translateX(${position}px)`;
      updateImageEffects();
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  }

  // --- Initialize each carousel with its own image set ---
  initCarousel(document.getElementById('screenshotsCarouselWrap'), [
    "Images/FluffyNature/FluffyNature_Final_Szilard_Ficsor.png",

    "Images/FluffyNature/FluffyNature_Screenshots_03_Szilard_Ficsor.png"
    
  ]);
